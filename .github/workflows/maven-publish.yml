# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  push:
    branches:
    - main

jobs:
  maven:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        cache: 'maven'

    - name: Build with Maven
      run: ./mvnw package

  docker-create-publish:

    runs-on: ubuntu-latest
    needs: maven
    permissions:
      contents: read
      packages: write

    steps:

    - name: Logging in to Docker
      run: docker login ghcr.io -u Akosok328 -p ${{ github.token }}

    - name: Build Docker image
      run: docker build -f $GITHUB_WORKSPACE/Dockerfile -t ghcr.io/akosok328/cubix/1/homework/app:springboot

    - name: Publish Docker image
      run: docker push ghcr.io/akosok328/cubix/1/homework/app:springboot

  docker-verify:

    runs-on: ubuntu-latest
    needs: docker-create-publish
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Verify Docker image
      run: ./verify-image.sh

 